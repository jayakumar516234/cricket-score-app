<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cricket Score" />
    <meta name="theme-color" content="#0a1a33" />
    <title>Cricket Score</title>
  </head>
  <body style="margin: 0; background: #060d19;">
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #0d1e38 0%, #060d19 100%); color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none;">
        <div style="position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: 0; border-radius: 50%; background: rgba(16, 185, 129, 0.15); border: 1.5px solid rgba(16, 185, 129, 0.4); animation: pulseScale 1.5s ease-in-out infinite;"></div>
          <svg viewBox="0 0 100 100" style="width: 76px; height: 76px; filter: drop-shadow(0 6px 12px rgba(16, 185, 129, 0.4));">
            <line x1="38" y1="36" x2="38" y2="72" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
            <line x1="45" y1="36" x2="45" y2="72" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
            <line x1="52" y1="36" x2="52" y2="72" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
            <line x1="36" y1="35" x2="45" y2="35" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
            <line x1="45" y1="35" x2="54" y2="35" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
            <g style="transform-origin: 75px 70px; animation: batSwing 1.3s ease-in-out infinite;">
              <rect x="68" y="24" width="7" height="38" rx="2" fill="#b45309" stroke="#78350f" stroke-width="1" />
              <rect x="70" y="14" width="3" height="11" rx="1" fill="#f8fafc" stroke="#64748b" stroke-width="0.8" />
              <circle x="71.5" y="13" r="1.5" fill="#f59e0b" />
            </g>
            <g style="animation: ballBounce 1.3s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;">
              <circle cx="28" cy="50" r="9.5" fill="#dc2626" />
              <circle cx="25.5" cy="46.5" r="2.8" fill="#f87171" opacity="0.6" />
              <path d="M 23 42 Q 28 50 23 58" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="1.5,1" />
              <path d="M 33 42 Q 28 50 33 58" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="1.5,1" />
            </g>
          </svg>
        </div>
        <div style="margin-top: 18px; text-align: center;">
          <h1 style="margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 0.5px; color: #ffffff;">CRICKET SCORE</h1>
          <p style="margin: 4px 0 0; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #34d399; text-transform: uppercase;">Entering Stadium...</p>
        </div>
        <style>
          @keyframes batSwing { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(18deg); } }
          @keyframes ballBounce { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(15px, -13px); } }
          @keyframes pulseScale { 0%, 100% { transform: scale(0.96); opacity: 0.5; } 50% { transform: scale(1.08); opacity: 0.9; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
